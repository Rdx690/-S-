name: Build VFX Downloader APK

on:
  push:
    branches: [vfx-downloader]
    tags: ['vfx-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vfx-downloader
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vfx-downloader-apks
          path: |
            vfx-downloader/app/build/outputs/apk/debug/*.apk
            vfx-downloader/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release APK
        if: startsWith(github.ref, 'refs/tags/vfx-') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vfx-downloader/app/build/outputs/apk/release/*.apk
            vfx-downloader/app/build/outputs/apk/debug/*.apk
