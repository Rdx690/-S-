name: Build VFX Downloader APK

on:
  push:
    branches: [vfx-downloader]
    tags: ['vfx-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug and release APKs
        run: gradle --no-daemon -p vfx-downloader assembleDebug assembleRelease
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vfx-downloader-apks
          path: |
            vfx-downloader/app/build/outputs/apk/debug/*.apk
            vfx-downloader/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/vfx-downloader'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vfx-latest
          name: VFX Downloader Latest Build
          body: Latest automatically built APKs from the vfx-downloader branch. Release APK is unsigned unless signing is configured; verify before public distribution.
          draft: false
          prerelease: true
          files: |
            vfx-downloader/app/build/outputs/apk/release/*.apk
            vfx-downloader/app/build/outputs/apk/debug/*.apk
